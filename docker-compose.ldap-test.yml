version: '3.8'

# Local OpenLDAP server for testing AD authentication
# Run with: docker compose -f docker-compose.ldap-test.yml up -d

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: test-ldap
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_ORGANISATION: "Test Company"
      LDAP_DOMAIN: "test.local"
      LDAP_BASE_DN: "dc=test,dc=local"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    volumes:
      - ./ldap-test-data:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service

  # Optional: LDAP admin UI
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: test-ldap-admin
    ports:
      - "8081:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      - openldap
