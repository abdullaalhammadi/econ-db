name: Build and Push Backend Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            # 1) Login to GitHub Container Registry
            echo ${{ secrets.TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2) Pull latest backend image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # 3) Ensure user-defined bridge network exists (Docker DNS)
            docker network inspect appnet >/dev/null 2>&1 || docker network create appnet

            # 4) Ensure oracle-db container is attached to appnet
            if ! docker network inspect appnet --format '{{json .Containers}}' | grep -q '"Name":"oracle-db"'; then
              docker network connect appnet oracle-db || true
            fi

            # 5) Stop and remove existing backend container if running
            docker stop econ-db-backend || true
            docker rm econ-db-backend || true

            # 6) Wait until the Oracle listener is reachable via the network
            echo "Checking Oracle connectivity on oracle-db:1521..."
            for i in $(seq 1 60); do
              if docker run --rm --network appnet busybox sh -c "nc -z oracle-db 1521"; then
                echo "✅ Oracle reachable on oracle-db:1521"
                break
              fi
              echo "Waiting for Oracle listener... (${i}/60)"
              sleep 2
            done

            # 7) Run the new backend container on the same network
            docker run -d \
              --name econ-db-backend \
              --network appnet \
              --restart unless-stopped \
              -p 5000:5000 \
              -e ORACLE_HOST="oracle-db" \
              -e ORACLE_PORT="1521" \
              -e ORACLE_SERVICE_NAME="${{ secrets.ORACLE_SERVICE_NAME }}" \
              -e ORACLE_USERNAME="${{ secrets.ORACLE_USERNAME }}" \
              -e ORACLE_PASSWORD="${{ secrets.ORACLE_PASSWORD }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "✅ Backend deployed successfully and connected to oracle-db via appnet network"
